            icon: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.04 2C6.57 2 2.12 6.45 2.12 11.92c0 1.75.46 3.46 1.33 4.96L2 22.18l5.43-1.42a9.85 9.85 0 0 0 4.61 1.17h.01c5.47 0 9.92-4.45 9.92-9.92C21.97 6.45 17.52 2 12.04 2Zm5.83 14.18c-.25.7-1.46 1.34-2.02 1.42-.52.08-1.17.11-1.89-.12-.43-.14-.99-.32-1.7-.63-2.99-1.29-4.94-4.3-5.09-4.5-.15-.2-1.22-1.62-1.22-3.09s.77-2.19 1.04-2.49c.27-.3.6-.37.8-.37h.57c.18.01.43-.07.67.51.25.6.85 2.08.92 2.23.08.15.13.32.03.52-.1.2-.15.32-.3.5-.15.18-.32.4-.45.54-.15.15-.31.32-.13.62.18.3.79 1.31 1.7 2.12 1.17 1.04 2.16 1.36 2.46 1.51.3.15.48.13.65-.08.2-.22.75-.87.95-1.17.2-.3.4-.25.67-.15.28.1 1.76.83 2.06.98.3.15.5.22.57.35.08.13.08.73-.17 1.43Z"/></svg>'
          },
          {
            label: "YouTube",
            href: "https://www.youtube.com/@abrhamdev",
            icon: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.12C19.54 3.58 12 3.58 12 3.58s-7.54 0-9.4.5A3 3 0 0 0 .5 6.2 31.3 31.3 0 0 0 0 12a31.3 31.3 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.12c1.86.5 9.4.5 9.4.5s7.54 0 9.4-.5a3 3 0 0 0 2.1-2.12A31.3 31.3 0 0 0 24 12a31.3 31.3 0 0 0-.5-5.8ZM9.6 15.57V8.43L15.85 12 9.6 15.57Z"/></svg>'
          }
        ];

        const headerPageLinks = [
          { label: "ITSA SEGURITY", href: "https://jhernandez30-cpu.github.io/ITSA-Segurity/", before: "Proyectos", external: true },
          { label: "JAH AI", href: "asistente-programacion.html" },
          { label: "ULTRON", href: "ULTRON%20AI/ultron.html" }
        ];

        const getLocalizedText = (value) => {
          if (typeof value === "string") return value;
          const locale = getPortfolioLocale();
          return value[locale] || value.es || value.en || "";
        };

	        const anchors = [
	          ["inicio", "#hero"],
	          ["billboard", "#hero"],
          ["main", ".home-wrapper"],
          ["servicios", ".about-services"],
          ["skills", ".about-services"],
          ["services", ".about-services"],
          ["sobre-mi", "#about"],
          ["about-profile", "#about"],
          ["about-me", "#about"],
          ["proyectos", "#projects"],
          ["portfolio", "#projects"],
          ["recursos", ".footer-content"],
          ["contacto", "#contact"],
	          ["contact", "#contact"]
	        ];

	        const projectLinks = [
	          {
	            labels: ["Mural Sandino", "Mural Interactivo Sandino"],
	            slugs: ["cubewar"],
	            href: "https://jhernandez30-cpu.github.io/ciencia-sociales/museo-sandino.html",
	            external: true
	          },
	          {
	            labels: ["Benjamín Zeledón", "Benjamin Zeledon"],
	            slugs: ["quibbo"],
	            href: "https://jhernandez30-cpu.github.io/ciencia-sociales/interactiva-benjamin/index.html",
	            external: true
	          },
	          {
	            labels: ["Variedades Nora"],
	            slugs: ["sharkie"],
	            href: "https://jhernandez30-cpu.github.io/Variedades-Nora/",
	            external: true
	          },
	          {
	            labels: ["THE JAH STORE"],
	            slugs: ["pokedex"],
	            href: "jah/index.html"
	          },
	          {
	            labels: ["JAH English AI", "JAH AI English"],
	            slugs: ["jah-english-ai"],
	            href: "JAH%20English%20AI/JAHEnglishAI.html"
	          }
	        ];

        const isExternal = (href) => /^https?:\/\//i.test(href);

        const setExternalAttrs = (anchor) => {
          if (!anchor || !isExternal(anchor.getAttribute("href") || "")) return;
          anchor.target = "_blank";
          anchor.rel = "noopener noreferrer";
        };

	        const setLocalAttrs = (anchor) => {
	          const href = anchor && anchor.getAttribute("href");
	          if (!href || href.startsWith("#") || isExternal(href)) return;
          anchor.removeAttribute("target");
          const rel = anchor.getAttribute("rel");
	          if (rel === "noopener noreferrer" || rel === "noopener") anchor.removeAttribute("rel");
	        };

	        const normalizeText = (value) => (value || "")
	          .normalize("NFD")
	          .replace(/[\u0300-\u036f]/g, "")
	          .toLowerCase()
	          .replace(/\s+/g, " ")
	          .trim();

        const createAliasAnchors = () => {
          anchors.forEach(([id, selector]) => {
            if (document.getElementById(id)) return;
            const target = document.querySelector(selector);
            if (!target || !target.parentNode) return;
            const marker = document.createElement("span");
            marker.id = id;
            marker.className = "preview-anchor-alias";
            marker.setAttribute("aria-hidden", "true");
            target.parentNode.insertBefore(marker, target);
          });
        };

        const enhanceSkills = () => {
          document.querySelectorAll(".box-services-list-item-name").forEach((item) => {
            if (item.querySelector("a")) return;
            const label = item.textContent.trim();
            const href = serviceMap.get(label);
            if (!href) return;
            const link = document.createElement("a");
            link.className = "preview-skill-link";
            link.href = href;
            link.textContent = label;
            item.replaceChildren(link);
          });
        };

        const enhanceFooterLinks = () => {
          document.querySelectorAll(".footer-content").forEach((footer) => {
            let nav = footer.querySelector(".preview-site-links");
            if (!nav) {
              nav = document.createElement("nav");
              nav.className = "preview-site-links";
              nav.setAttribute("aria-label", getLocalizedText({
                es: "Enlaces principales del sitio",
                en: "Main site links"
              }));

              const credits = footer.querySelector(".footer-credits");
              footer.insertBefore(nav, credits || null);
            }
            nav.setAttribute("aria-label", getLocalizedText({
              es: "Enlaces principales del sitio",
              en: "Main site links"
            }));

            siteLinks.forEach(([label, href, options = {}], index) => {
              let link = nav.querySelector(`[data-preview-site-link="${index}"]`);
              if (!link) {
                link = document.createElement("a");
                link.setAttribute("data-preview-site-link", String(index));
                nav.appendChild(link);
              }
              link.href = href;
              link.textContent = getLocalizedText(label);
              if (options.download) link.setAttribute("download", "");
              else link.removeAttribute("download");
              if (options.external || isExternal(href)) setExternalAttrs(link);
              else setLocalAttrs(link);
            });
          });
        };

        const enhanceSocials = () => {
          document.querySelectorAll(".social").forEach((social) => {
            if (social.querySelector("[data-preview-social-extra]")) return;
            const baseButton = social.querySelector(".button-wrapper");
            const variant = baseButton && baseButton.classList.contains("button-wrapper-background")
              ? "button-wrapper-background"
              : "button-wrapper-theme";

            socialExtras.forEach(({ label, href, icon }) => {
              const link = document.createElement("a");
              link.href = href;
              link.className = "social-link preview-social-extra";
              link.setAttribute("aria-label", label);
              link.setAttribute("data-cursor", "circle-white");
              link.setAttribute("data-preview-social-extra", label.toLowerCase());
              setExternalAttrs(link);

              const button = document.createElement("div");
              button.className = `button-wrapper ${variant} button-wrapper-rounded button-round button-round-size-md children-unclickable children-unclickable`;
              button.setAttribute("data-v-8f5c0673", "");
              button.setAttribute("data-v-801e9213", "");
              button.setAttribute("data-hoversound", "hover");

              const text = document.createElement("span");
              text.className = "preview-social-icon";
              text.innerHTML = icon;

              button.appendChild(text);
              link.appendChild(button);
              social.appendChild(link);
            });
          });
        };

        const enhanceHeaderPageLinks = () => {
          document.querySelectorAll(".header-home-links").forEach((nav) => {
            headerPageLinks.forEach(({ label, href, before, external }) => {
              if (nav.querySelector(`[data-preview-header-page-link="${href}"]`)) return;
              const link = document.createElement("a");
              link.href = href;
              link.textContent = label;
              link.className = "header-link header-home-link children-unclickable preview-header-page-link";
              link.setAttribute("aria-label", label);
              link.setAttribute("data-cursor", "circle-white");
              link.setAttribute("data-sound", "click");
              link.setAttribute("data-hoversound", "hover");
              link.setAttribute("data-preview-header-page-link", href);
              link.setAttribute("data-v-7da04cd0", "");
              link.setAttribute("data-v-befa5166", "");
              if (external) setExternalAttrs(link);

              const reference = before
                ? Array.from(nav.querySelectorAll(".header-home-link"))
                  .find((item) => item.getAttribute("aria-label") === before)

              nav.insertBefore(link, reference || null);
            });
          });
        };

        const hideHeaderContactLink = () => {
          document.querySelectorAll('.header-home-links > button[aria-label="Contacto"]').forEach((button) => {
            button.classList.add("preview-header-hidden");
            button.setAttribute("aria-hidden", "true");
            button.setAttribute("tabindex", "-1");
          });
        };

	        const replacePreviewLogos = () => {
          document.querySelectorAll("svg.logo-svg").forEach((logo) => {
            const image = document.createElement("img");
            image.src = "assets/jah-logo.png";
            image.alt = "JAH";
            image.className = "preview-jah-logo-image";
            image.width = 56;
            image.height = 60;
            logo.replaceWith(image);
          });
        };

        const disablePreviewAudio = () => {
          document.querySelectorAll(".header-sounds-toggle, .footer-credits-music").forEach((item) => {
            item.remove();
          });
          document.querySelectorAll("[data-sound], [data-hoversound]").forEach((item) => {
            item.removeAttribute("data-sound");
            item.removeAttribute("data-hoversound");
          });
          document.querySelectorAll("audio").forEach((audio) => {
            audio.pause();
            audio.removeAttribute("src");
            audio.load();
          });
        };

        const syncHeaderActiveBar = () => {
          document.querySelectorAll(".header-home-links").forEach((nav) => {
            const bar = nav.querySelector(".header-home-bar");
            const active = nav.querySelector(".header-home-link-active");
            if (!bar || !active) return;
            if (active.classList.contains("preview-header-hidden")) {
              if (bar.style.opacity !== "0") bar.style.opacity = "0";
              return;
            }
            if (bar.style.opacity) bar.style.opacity = "";
            const offset = Math.max(0, active.offsetLeft - bar.offsetLeft);
            const transform = `translateX(${offset}px)`;
            if (bar.style.transform !== transform) bar.style.transform = transform;
          });
        };

	        const fixExistingLinks = () => {
	          document.querySelectorAll("a[href]").forEach((link) => {
	            if (isExternal(link.getAttribute("href") || "")) setExternalAttrs(link);
	            else setLocalAttrs(link);
	          });
          document.querySelectorAll('a[href="contacto.html"]').forEach((link) => {
	            if (link.textContent.trim().toLowerCase() === "mail") link.setAttribute("aria-label", "Contacto");
	          });
	        };

		        const findProjectLinkTarget = (link) => {
		          if (!link) return null;
		          const rawHref = link.getAttribute("href") || "";
		          const linkText = normalizeText([
		            link.textContent,
		            link.getAttribute("aria-label"),
		            link.querySelector("img")?.getAttribute("alt")
		          ].filter(Boolean).join(" "));
		          const context = normalizeText(link.closest(".project, .project-content, .project-card, .work-card, .preview-card, article, li, section")?.textContent || "");

		          return projectLinks.find((project) => {
		            const matchesLabel = project.labels.some((label) => {
		              const normalizedLabel = normalizeText(label);
		              return linkText.includes(normalizedLabel) || context.includes(normalizedLabel);
		            });
		            const matchesSlug = project.slugs.some((slug) => rawHref.includes(slug));
		            return matchesLabel || matchesSlug;
		          }) || null;
		        };

		        const connectProjectLinks = () => {
		          document.querySelectorAll("a[href]").forEach((link) => {
		            const match = findProjectLinkTarget(link);

		            if (!match) return;
		            link.href = match.href;
		            link.setAttribute("data-preview-project-link", match.labels[0]);
		            link.setAttribute("aria-label", `Abrir ${match.labels[0]}`);

	            if (match.external) {
	              setExternalAttrs(link);
	            } else {
	              link.removeAttribute("target");
	              link.removeAttribute("rel");
		            }
		          });
		        };

		        const handleProjectLinkClick = (event) => {
		          const link = event.target.closest?.("a[href], .preview-card");
		          const anchor = link && link.matches("a[href]") ? link : link?.closest?.("a[href]");
		          const match = findProjectLinkTarget(anchor);
		          if (!match) return;

		          event.preventDefault();
		          event.stopImmediatePropagation();

		          if (match.external || event.metaKey || event.ctrlKey || event.shiftKey || event.button === 1) {
		            window.open(match.href, "_blank", "noopener,noreferrer");
		            return;
		          }

			          window.location.href = match.href;
			        };

        const scrollInitialHash = () => {
          if (!window.location.hash) return true;
          const target = document.getElementById(window.location.hash.slice(1));
          if (!target) return false;
          target.scrollIntoView({ block: "start" });
          return true;
        };

        let hashHandled = false;
        let hashScrollScheduled = false;
        const enhancePreviewNavigation = () => {
          createAliasAnchors();
          enhanceSkills();
          enhanceFooterLinks();
          enhanceSocials();
          enhanceHeaderPageLinks();
          hideHeaderContactLink();
	          replacePreviewLogos();
	          syncHeaderActiveBar();
	          disablePreviewAudio();
	          fixExistingLinks();
	          connectProjectLinks();
	          if (!hashHandled && !hashScrollScheduled) {
            hashScrollScheduled = true;
            window.setTimeout(() => {
              hashScrollScheduled = false;
              hashHandled = scrollInitialHash();
            }, 80);
          }
	        };

		        document.addEventListener("DOMContentLoaded", enhancePreviewNavigation);
		        window.addEventListener("load", enhancePreviewNavigation);
		        document.addEventListener("click", handleProjectLinkClick, true);
		        document.addEventListener("auxclick", handleProjectLinkClick, true);

	        let attempts = 0;
        const interval = window.setInterval(() => {
          enhancePreviewNavigation();
          attempts += 1;
          if (attempts > 80) window.clearInterval(interval);
        }, 250);

        let scheduled = false;
        const scheduleEnhancement = () => {
          if (scheduled) return;
          scheduled = true;
          window.requestAnimationFrame(() => {
            scheduled = false;
            enhancePreviewNavigation();
          });
        };

        const observer = new MutationObserver(scheduleEnhancement);
        observer.observe(document.documentElement, {
          childList: true,
          subtree: true,
          attributes: true,
          attributeFilter: ["class", "style"]
        });
      })();
    </script>
    <script src="js/script.js"></script>
    <script src="js/cookies-preview-only.js"></script>
  </body>
</html>
