  <div class="custom-cursor" aria-hidden="true"></div>

  <main class="programming-shell">
    <section class="chat-app" aria-label="Chat de programación con JAH AI y TUTOR_IA">
      <aside class="chat-sidebar" id="chatSidebar" aria-label="Historial de conversaciones">
        <div class="sidebar-mobile-row">
          <button id="closeSidebarBtn" class="sidebar-icon" type="button" aria-label="Cerrar historial">
            <i class="fas fa-times" aria-hidden="true"></i>
          </button>
        </div>

        <label class="chat-search sidebar-nav-item is-active" for="chatSearchInput">
          <i class="fas fa-search" aria-hidden="true"></i>
          <input id="chatSearchInput" type="search" placeholder="Buscar" autocomplete="off">
        </label>

        <div class="brain-status sidebar-nav-item" id="brainStatus" data-state="checking">
          <span class="brain-status-dot" aria-hidden="true"></span>
          <strong id="brainStatusText">Conectando con TUTOR_IA</strong>
        </div>

        <nav class="sidebar-nav" aria-label="Navegación de JAH AI">
          <button id="newChatBtn" class="sidebar-nav-item sidebar-action" type="button">
            <i class="fas fa-plus" aria-hidden="true"></i>
            <span>Nuevo chat</span>
          </button>
          <button class="sidebar-nav-item sidebar-ghost" type="button">
            <i class="fas fa-clock-rotate-left" aria-hidden="true"></i>
            <span>Historial</span>
          </button>
          <button class="sidebar-nav-item sidebar-ghost" type="button">
            <i class="fas fa-compass" aria-hidden="true"></i>
            <span>Descubrir</span>
          </button>
          <button class="sidebar-nav-item sidebar-ghost" type="button">
            <i class="fas fa-grip" aria-hidden="true"></i>
            <span>Espacios</span>
          </button>
          <button class="sidebar-nav-item sidebar-ghost" type="button">
            <i class="fas fa-code" aria-hidden="true"></i>
            <span>Proyectos</span>
          </button>
          <button class="sidebar-nav-item sidebar-ghost" type="button">
            <i class="fas fa-shield-halved" aria-hidden="true"></i>
            <span>Seguridad</span>
          </button>
          <button class="sidebar-nav-item sidebar-ghost" type="button">
            <i class="fas fa-ellipsis" aria-hidden="true"></i>
            <span>Más</span>
          </button>
        </nav>

        <div class="history-heading">
          <span>Historial</span>
          <button id="clearHistoryBtn" type="button">Limpiar</button>
        </div>

        <div id="chatHistoryList" class="chat-history-list" aria-live="polite"></div>
      </aside>

      <div id="sidebarBackdrop" class="sidebar-backdrop" hidden></div>

      <section class="chat-main" aria-labelledby="assistantTitle">
        <div class="chat-topbar">
          <button id="openSidebarBtn" class="topbar-icon" type="button" aria-label="Abrir historial">
            <i class="fas fa-bars" aria-hidden="true"></i>
          </button>
          <div class="chat-title">
            <strong>JAH AI</strong>
            <span id="activeChatLabel">Nuevo chat</span>
          </div>
        </div>

        <div id="assistantAuthArea" class="assistant-auth-bar" data-auth-state="guest">
          <div id="guestAuthActions" class="guest-auth-actions">
            <button id="openLoginBtn" class="auth-pill auth-pill-dark" type="button">Iniciar sesi&oacute;n</button>
            <button id="openRegisterBtn" class="auth-pill auth-pill-light" type="button">Registrarse gratuitamente</button>
          </div>

          <div id="userAccountArea" class="user-account-area" hidden>
            <button id="userMenuBtn" class="user-account-button" type="button" aria-haspopup="true" aria-expanded="false">
              <span id="userAvatar" class="user-avatar" aria-hidden="true">U</span>
              <span id="userDisplayName" class="user-display-name">Usuario</span>
              <i class="fas fa-chevron-down" aria-hidden="true"></i>
            </button>

            <div id="userMenu" class="user-menu" role="menu" hidden>
              <button type="button" role="menuitem" data-account-action="upgrade">
                <i class="fas fa-arrow-up-right-dots" aria-hidden="true"></i>
                <span>Upgrade plan</span>
              </button>
              <button type="button" role="menuitem" data-account-action="personalization">
                <i class="fas fa-wand-magic-sparkles" aria-hidden="true"></i>
                <span>Personalizaci&oacute;n</span>
              </button>
              <button type="button" role="menuitem" data-account-action="profile">
                <i class="fas fa-user" aria-hidden="true"></i>
                <span>Perfil</span>
              </button>
              <button type="button" role="menuitem" data-account-action="settings">
                <i class="fas fa-gear" aria-hidden="true"></i>
                <span>Configuraci&oacute;n</span>
              </button>
              <button type="button" role="menuitem" data-account-action="help">
                <i class="fas fa-circle-question" aria-hidden="true"></i>
                <span>Ayuda</span>
              </button>
              <span class="user-menu-divider" aria-hidden="true"></span>
              <button type="button" role="menuitem" data-account-action="logout">
                <i class="fas fa-right-from-bracket" aria-hidden="true"></i>
                <span>Cerrar sesi&oacute;n</span>
              </button>
            </div>
          </div>
        </div>

        <div id="coachMessages" class="chat-messages" aria-live="polite">
          <div id="emptyChatState" class="empty-chat-state">
            <h1 id="assistantTitle">JAH AI</h1>
            <button id="loginSoftInvite" class="login-soft-invite" type="button">Inicia sesi&oacute;n para guardar perfil, preferencias e historial entre dispositivos.</button>
          </div>
        </div>

        <form id="coachForm" class="chat-composer" autocomplete="off" enctype="multipart/form-data">
          <div class="composer-card">
            <textarea id="coachInput" rows="1" placeholder="Mensaje a JAH AI" aria-label="Mensaje para JAH AI"></textarea>

            <div id="attachmentPreview" class="attachment-preview" aria-live="polite" hidden></div>

            <div id="jarvisStatus" class="jarvis-status" role="status" aria-live="polite"></div>

            <div class="composer-toolbar">
              <div class="composer-tools" aria-label="Herramientas del asistente">
                <button id="tutorIABtn" class="tool-chip is-active" type="button" aria-pressed="true">
                  <i class="fas fa-brain" aria-hidden="true"></i>
                  <span>Cerebro tutor_ia</span>
                </button>

                <button id="smartSearchBtn" class="tool-chip" type="button" aria-pressed="false">
                  <i class="fas fa-globe-americas" aria-hidden="true"></i>
                  <span>Búsqueda inteligente</span>
                </button>

                <label class="attach-chip" for="fileInput" aria-label="Subir archivos e imágenes">
                  <i class="fas fa-paperclip" aria-hidden="true"></i>
                </label>
                <input id="fileInput" class="file-input" name="files" type="file" multiple accept=".png,.jpg,.jpeg,.webp,.pdf,.docx,.txt,.md,.csv,.json,.py,.js,.html,.css,.sql,.cs,image/png,image/jpeg,image/webp,application/pdf,text/plain,text/csv">
              </div>

              <div class="composer-actions">
                <button id="jarvisVoiceBtn" class="jarvis-voice-btn" type="button" aria-label="Hablar con Jarvis" aria-pressed="false" title="Hablar con Jarvis">
                  <i class="fas fa-microphone" aria-hidden="true"></i>
                  <span class="jarvis-voice-label">Jarvis</span>
                </button>

                <button class="send-orb" type="submit" aria-label="Enviar mensaje">
                  <i class="fas fa-arrow-up" aria-hidden="true"></i>
                </button>
              </div>
            </div>
          </div>
        </form>

        <div class="quick-context-card" aria-hidden="true">
          <div class="quick-context-title">
            <i class="fas fa-computer" aria-hidden="true"></i>
            <span>Cerebro JAH AI</span>
          </div>
          <div class="quick-context-lines">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
