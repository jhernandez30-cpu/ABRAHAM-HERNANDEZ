  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#0b7cff">
  <meta name="application-name" content="Asistente de Programación">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Asistente Dev">

  <link rel="icon" type="image/png" href="assets/jah-logo.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/abraham-portrait-01.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/seo-pages.css">
  <link rel="stylesheet" href="css/programming-assistant.css">
  <link rel="stylesheet" href="css/jarvis.css">
</head>
<body class="programming-app-page">
  <header>
    <nav class="navbar" id="navbar">
      <div class="logo">
        <a href="index.html" class="brand-logo" aria-label="Inicio - Abraham Hernández">
          <img src="assets/jah-logo.png" alt="Logo JAH de Abraham Hernández" width="180" height="120" loading="eager" decoding="async">
        </a>
      </div>
      <div class="nav-links">
        <a href="index.html" class="nav-link">Inicio</a>
        <a href="servicios/" class="nav-link">Servicios</a>
        <a href="proyectos/" class="nav-link">Proyectos</a>
        <a href="sobre-mi/" class="nav-link">Sobre mí</a>
        <a href="asistente-programacion.html" class="nav-link active">Asistente</a>
        <a href="contacto.html" class="nav-link">Contacto</a>
      </div>
    </nav>
  </header>

  <div class="custom-cursor" aria-hidden="true"></div>

  <main class="programming-shell">
    <section class="chat-app" aria-label="Chat de programación con TUTOR_IA">
      <aside class="chat-sidebar" id="chatSidebar" aria-label="Historial de conversaciones">
        <div class="sidebar-top">
          <button id="newChatBtn" class="sidebar-action primary" type="button">
            <i class="fas fa-edit" aria-hidden="true"></i>
            <span>Nuevo chat</span>
          </button>
          <button id="closeSidebarBtn" class="sidebar-icon" type="button" aria-label="Cerrar historial">
            <i class="fas fa-times" aria-hidden="true"></i>
          </button>
        </div>

        <label class="chat-search" for="chatSearchInput">
          <i class="fas fa-search" aria-hidden="true"></i>
          <input id="chatSearchInput" type="search" placeholder="Buscar chat" autocomplete="off">
        </label>

        <div class="brain-status" id="brainStatus" data-state="checking">
          <span class="brain-status-dot" aria-hidden="true"></span>
          <strong id="brainStatusText">Conectando con TUTOR_IA</strong>
        </div>

        <div class="history-heading">
          <span>Historial de chat</span>
          <button id="clearHistoryBtn" type="button">Limpiar</button>
        </div>

        <div id="chatHistoryList" class="chat-history-list" aria-live="polite"></div>
      </aside>

      <div id="sidebarBackdrop" class="sidebar-backdrop" hidden></div>

      <section class="chat-main" aria-labelledby="assistantTitle">
        <div class="chat-topbar">
          <button id="openSidebarBtn" class="topbar-icon" type="button" aria-label="Abrir historial">
            <i class="fas fa-bars" aria-hidden="true"></i>
          </button>
          <div class="chat-title">
            <strong>Asistente de Programación</strong>
            <span id="activeChatLabel">Nuevo chat</span>
          </div>
        </div>

        <div id="coachMessages" class="chat-messages" aria-live="polite">
          <div id="emptyChatState" class="empty-chat-state">
            <h1 id="assistantTitle">¿En qué estás trabajando?</h1>
          </div>
        </div>

        <form id="coachForm" class="chat-composer" autocomplete="off" enctype="multipart/form-data">
          <div class="composer-card">
            <textarea id="coachInput" rows="1" placeholder="Mensaje a tu asistente de programación" aria-label="Mensaje para el asistente"></textarea>

            <div id="attachmentPreview" class="attachment-preview" aria-live="polite" hidden></div>

            <div id="jarvisStatus" class="jarvis-status" role="status" aria-live="polite"></div>

            <div class="composer-toolbar">
              <div class="composer-tools" aria-label="Herramientas del asistente">
                <button id="tutorIABtn" class="tool-chip is-active" type="button" aria-pressed="true">
                  <i class="fas fa-brain" aria-hidden="true"></i>
                  <span>Cerebro tutor_ia</span>
                </button>

                <button id="smartSearchBtn" class="tool-chip" type="button" aria-pressed="false">
                  <i class="fas fa-globe-americas" aria-hidden="true"></i>
                  <span>Búsqueda inteligente</span>
                </button>

                <label class="attach-chip" for="fileInput" aria-label="Subir archivos e imágenes">
                  <i class="fas fa-paperclip" aria-hidden="true"></i>
                </label>
                <input id="fileInput" class="file-input" name="files" type="file" multiple accept=".png,.jpg,.jpeg,.webp,.pdf,.docx,.txt,.py,.js,.html,.css,.json,.md,.sql,.cs,image/png,image/jpeg,image/webp,application/pdf,text/plain">
              </div>

              <div class="composer-actions">
                <button id="jarvisVoiceBtn" class="jarvis-voice-btn" type="button" aria-label="Hablar con Jarvis" aria-pressed="false" title="Hablar con Jarvis">
                  <i class="fas fa-microphone" aria-hidden="true"></i>
                  <span class="jarvis-voice-label">Jarvis</span>
                </button>

                <button class="send-orb" type="submit" aria-label="Enviar mensaje">
                  <i class="fas fa-arrow-up" aria-hidden="true"></i>
                </button>
              </div>
            </div>
          </div>
        </form>
      </section>
    </section>
  </main>

  <script>
    window.TUTOR_IA_PROJECT_PATH = 'C:\\Users\\herna\\Documents\\ABRAHAM-HERNANDEZ-main';
    window.TUTOR_IA_BRIDGE_URL = 'http://127.0.0.1:8787';
    window.JARVIS_READ_RESPONSES = true;
    window.TUTOR_IA_ENDPOINTS = [
      'http://127.0.0.1:8787/api/chat',
      'http://127.0.0.1:8787/api/ask',
      'http://127.0.0.1:8787/ask',
      'http://localhost:8787/api/chat',
      'http://localhost:8787/api/ask'
    ];
  </script>
  <script src="js/jarvis-assistant.js"></script>
  <script src="js/programming-assistant.js"></script>
</body>
</html>
