[project]
name = "abraham-hernandez"
version = "0.1.0"
description = "Portfolio and JAH AI Bridge FastAPI backend."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",
  "requests>=2.31.0",
  "chromadb>=0.5.0",
  "langchain-text-splitters>=0.2.0",
  "PyMuPDF>=1.24.0",
  "python-docx>=1.1.0",
  "python-dotenv>=1.0.0",
  "psycopg[binary]>=3.2.0",
  "pyodbc>=5.1.0",
]

[tool.vercel]
entrypoint = "bridge_api.main:app"
